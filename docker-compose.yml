version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: marketing_db
    environment:
      POSTGRES_USER: marketing_user
      POSTGRES_PASSWORD: secure_password
      POSTGRES_DB: marketing_ai
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U marketing_user"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: marketing_app
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://marketing_user:secure_password@db:5432/marketing_ai
      CLAUDE_API_KEY: ${CLAUDE_API_KEY}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      FLASK_ENV: development
      DEBUG: 'True'
    ports:
      - "5000:5000"
    volumes:
      - .:/app
      - /app/__pycache__
    command: python dashboard/app.py

volumes:
  postgres_data:
