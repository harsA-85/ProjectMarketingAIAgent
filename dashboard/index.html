<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Marketing AI Agent Dashboard</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'SF Pro Text', sans-serif;
            background: #f2f2f7;
            min-height: 100vh;
            overflow: hidden;
        }

        .app {
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        /* ── SIDEBAR ── */
        .sidebar {
            width: 220px;
            min-width: 220px;
            background: #e8e8ed;
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-right: 1px solid #d1d1d6;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }

        .sidebar-header {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 20px 16px 16px;
            border-bottom: 1px solid #d1d1d6;
        }

        .app-icon {
            width: 32px;
            height: 32px;
            background: #007aff;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
        }

        .app-name {
            font-size: 14px;
            font-weight: 600;
            color: #1c1c1e;
        }

        .sidebar-nav {
            padding: 8px 8px;
            flex: 1;
        }

        .nav-item {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 7px 10px;
            border-radius: 7px;
            font-size: 13px;
            font-weight: 500;
            color: #1c1c1e;
            cursor: pointer;
            transition: background 0.15s;
            user-select: none;
        }

        .nav-item:hover {
            background: rgba(0,0,0,0.06);
        }

        .nav-item.active {
            background: rgba(0,122,255,0.15);
            color: #007aff;
        }

        .sidebar-stats {
            padding: 12px 16px 20px;
            border-top: 1px solid #d1d1d6;
        }

        .sidebar-stat {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 4px 0;
        }

        .sidebar-stat-label {
            font-size: 12px;
            color: #6e6e73;
        }

        .sidebar-stat-value {
            font-size: 12px;
            font-weight: 600;
            color: #1c1c1e;
        }

        /* ── MAIN CONTENT ── */
        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            background: #f2f2f7;
        }

        /* ── WINDOW CHROME ── */
        .window-chrome {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 16px;
            background: rgba(255,255,255,0.7);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-bottom: 1px solid #d1d1d6;
            flex-shrink: 0;
        }

        .traffic-lights {
            display: flex;
            gap: 6px;
            align-items: center;
        }

        .tl {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            display: inline-block;
        }

        .tl.red   { background: #ff5f57; }
        .tl.yellow { background: #febc2e; }
        .tl.green  { background: #28c840; }

        .window-title {
            font-size: 13px;
            font-weight: 600;
            color: #1c1c1e;
        }

        /* ── CONTENT AREA ── */
        .content-area {
            flex: 1;
            overflow-y: auto;
            padding: 24px;
        }

        /* ── TOOLBAR ── */
        .toolbar {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 20px;
        }

        .toolbar-title {
            font-size: 22px;
            font-weight: 700;
            color: #1c1c1e;
            flex: 1;
        }

        .search-input {
            background: rgba(118,118,128,0.12);
            border: none;
            border-radius: 8px;
            padding: 8px 12px;
            font-size: 14px;
            font-family: inherit;
            color: #1c1c1e;
            width: 200px;
            outline: none;
            transition: box-shadow 0.2s;
        }

        .search-input:focus {
            box-shadow: 0 0 0 3px rgba(0,122,255,0.3);
        }

        .search-input::placeholder {
            color: #6e6e73;
        }

        .btn-primary {
            background: #007aff;
            color: white;
            border: none;
            border-radius: 8px;
            padding: 8px 16px;
            font-size: 14px;
            font-weight: 500;
            font-family: inherit;
            cursor: pointer;
            transition: opacity 0.15s;
            white-space: nowrap;
        }

        .btn-primary:hover {
            opacity: 0.85;
        }

        .btn-secondary {
            background: rgba(0,122,255,0.1);
            color: #007aff;
            border: none;
            border-radius: 8px;
            padding: 8px 16px;
            font-size: 14px;
            font-weight: 500;
            font-family: inherit;
            cursor: pointer;
            transition: background 0.15s;
        }

        .btn-secondary:hover {
            background: rgba(0,122,255,0.18);
        }

        /* ── STATS ROW ── */
        .stats-row {
            display: flex;
            gap: 16px;
            margin-bottom: 24px;
        }

        .stat-card {
            background: white;
            border-radius: 12px;
            box-shadow: 0 2px 16px rgba(0,0,0,0.06);
            padding: 18px 22px;
            flex: 1;
            min-width: 0;
        }

        .stat-number {
            font-size: 32px;
            font-weight: 700;
            color: #007aff;
            line-height: 1.1;
        }

        .stat-label {
            font-size: 13px;
            color: #6e6e73;
            margin-top: 4px;
        }

        /* ── AGENTS GRID ── */
        .agents-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 16px;
        }

        .agent-card {
            background: white;
            border-radius: 12px;
            box-shadow: 0 2px 16px rgba(0,0,0,0.06);
            padding: 18px;
            cursor: pointer;
            transition: box-shadow 0.2s, transform 0.15s;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .agent-card:hover {
            box-shadow: 0 4px 24px rgba(0,0,0,0.12);
            transform: translateY(-1px);
        }

        .agent-card-top {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .agent-avatar {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 18px;
            font-weight: 700;
            flex-shrink: 0;
        }

        .agent-card-info {
            flex: 1;
            min-width: 0;
        }

        .agent-name {
            font-size: 15px;
            font-weight: 600;
            color: #1c1c1e;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .agent-brand {
            font-size: 13px;
            color: #6e6e73;
            margin-top: 2px;
        }

        .agent-fields {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
        }

        .field-badge {
            background: rgba(118,118,128,0.12);
            color: #6e6e73;
            font-size: 11px;
            font-weight: 500;
            padding: 3px 8px;
            border-radius: 20px;
        }

        .agent-card-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-top: 10px;
            border-top: 1px solid #f2f2f7;
        }

        .agent-meta {
            font-size: 12px;
            color: #6e6e73;
        }

        .agent-open-link {
            font-size: 13px;
            font-weight: 500;
            color: #007aff;
            text-decoration: none;
        }

        /* ── LOADING & ERROR ── */
        .loading {
            text-align: center;
            padding: 60px 40px;
            font-size: 15px;
            color: #6e6e73;
        }

        .error-msg {
            background: rgba(255,59,48,0.1);
            color: #ff3b30;
            padding: 16px;
            border-radius: 12px;
            font-size: 14px;
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #6e6e73;
        }

        .empty-state-icon {
            font-size: 48px;
            margin-bottom: 12px;
        }

        .empty-state p {
            font-size: 15px;
        }

        /* Avatar color palette */
        .avatar-0 { background: #007aff; }
        .avatar-1 { background: #34c759; }
        .avatar-2 { background: #ff9f0a; }
        .avatar-3 { background: #ff375f; }
        .avatar-4 { background: #af52de; }
        .avatar-5 { background: #5ac8fa; }
        .avatar-6 { background: #ff6b35; }
        .avatar-7 { background: #30b0c7; }
    </style>
</head>
<body>
    <div class="app">
        <!-- SIDEBAR -->
        <div class="sidebar">
            <div class="sidebar-header">
                <div class="app-icon">🤖</div>
                <div class="app-name">Marketing AI</div>
            </div>
            <nav class="sidebar-nav">
                <div class="nav-item active">🤖&nbsp; All Agents</div>
                <div class="nav-item">📊&nbsp; Analytics</div>
                <div class="nav-item">⚙️&nbsp; Settings</div>
            </nav>
            <div class="sidebar-stats" id="sidebar-stats">
                <!-- populated by JS -->
            </div>
        </div>

        <!-- MAIN CONTENT -->
        <div class="main-content">
            <!-- Window Chrome -->
            <div class="window-chrome">
                <div class="traffic-lights">
                    <span class="tl red"></span>
                    <span class="tl yellow"></span>
                    <span class="tl green"></span>
                </div>
                <div class="window-title">Marketing AI Agent</div>
                <div style="width:56px"></div>
            </div>

            <!-- Content Area -->
            <div class="content-area">
                <!-- Toolbar -->
                <div class="toolbar">
                    <div class="toolbar-title">Agents</div>
                    <input class="search-input" type="text" placeholder="🔍 Search agents..." id="searchInput" oninput="filterAgents(this.value)">
                    <button class="btn-secondary" onclick="loadDashboard()">↺ Refresh</button>
                </div>

                <!-- Stats Row -->
                <div class="stats-row" id="stats">
                    <div class="loading">Loading...</div>
                </div>

                <!-- Agents Grid -->
                <div id="agents">
                    <div class="loading">Loading agents...</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        let allAgents = [];

        const avatarColors = ['avatar-0','avatar-1','avatar-2','avatar-3','avatar-4','avatar-5','avatar-6','avatar-7'];

        function getAvatarClass(name) {
            let hash = 0;
            for (let i = 0; i < name.length; i++) hash = name.charCodeAt(i) + ((hash << 5) - hash);
            return avatarColors[Math.abs(hash) % avatarColors.length];
        }

        function viewAgentDetails(agentId) {
            window.location.href = `/agent-detail.html?id=${agentId}`;
        }

        function filterAgents(query) {
            const q = query.toLowerCase();
            const filtered = allAgents.filter(a =>
                a.agent_name.toLowerCase().includes(q) ||
                a.brand.toLowerCase().includes(q) ||
                (a.fields || []).some(f => f.toLowerCase().includes(q))
            );
            renderAgentCards(filtered);
        }

        function renderAgentCards(agents) {
            if (!agents || agents.length === 0) {
                document.getElementById('agents').innerHTML = `
                    <div class="empty-state">
                        <div class="empty-state-icon">🤖</div>
                        <p>No agents found.</p>
                    </div>
                `;
                return;
            }

            document.getElementById('agents').innerHTML = `
                <div class="agents-grid">
                    ${agents.map(agent => {
                        const initials = agent.agent_name ? agent.agent_name[0].toUpperCase() : '?';
                        const colorClass = getAvatarClass(agent.agent_name);
                        const fields = (agent.fields || []).slice(0, 4);
                        const totalPosts = (agent.draft_posts || 0) + (agent.analytics?.total_posts || 0) + (agent.scheduled_posts || 0);
                        return `
                        <div class="agent-card" onclick="viewAgentDetails(${agent.agent_id})">
                            <div class="agent-card-top">
                                <div class="agent-avatar ${colorClass}">${initials}</div>
                                <div class="agent-card-info">
                                    <div class="agent-name">${agent.agent_name}</div>
                                    <div class="agent-brand">${agent.brand}</div>
                                </div>
                            </div>
                            ${fields.length > 0 ? `
                            <div class="agent-fields">
                                ${fields.map(f => `<span class="field-badge">${f}</span>`).join('')}
                            </div>` : ''}
                            <div class="agent-card-footer">
                                <span class="agent-meta">${totalPosts} post${totalPosts !== 1 ? 's' : ''} &middot; ${agent.analytics?.total_interactions || 0} interactions</span>
                                <a class="agent-open-link" href="/agent-detail.html?id=${agent.agent_id}" onclick="event.stopPropagation()">Open →</a>
                            </div>
                        </div>
                        `;
                    }).join('')}
                </div>
            `;
        }

        async function loadDashboard() {
            document.getElementById('stats').innerHTML = '<div class="loading">Loading...</div>';
            document.getElementById('agents').innerHTML = '<div class="loading">Loading agents...</div>';

            try {
                const response = await fetch('/api/agents');
                const data = await response.json();

                allAgents = data.agents || [];

                // Stats row
                document.getElementById('stats').innerHTML = `
                    <div class="stat-card">
                        <div class="stat-number">${data.total_agents}</div>
                        <div class="stat-label">Total Agents</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-number">${data.total_posts}</div>
                        <div class="stat-label">Total Posts</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-number">${data.total_interactions}</div>
                        <div class="stat-label">Total Interactions</div>
                    </div>
                `;

                // Sidebar stats
                document.getElementById('sidebar-stats').innerHTML = `
                    <div class="sidebar-stat">
                        <span class="sidebar-stat-label">Agents</span>
                        <span class="sidebar-stat-value">${data.total_agents}</span>
                    </div>
                    <div class="sidebar-stat">
                        <span class="sidebar-stat-label">Posts</span>
                        <span class="sidebar-stat-value">${data.total_posts}</span>
                    </div>
                    <div class="sidebar-stat">
                        <span class="sidebar-stat-label">Interactions</span>
                        <span class="sidebar-stat-value">${data.total_interactions}</span>
                    </div>
                `;

                renderAgentCards(allAgents);

            } catch (error) {
                console.error('Error:', error);
                document.getElementById('stats').innerHTML = '';
                document.getElementById('agents').innerHTML = `
                    <div class="error-msg">Error loading dashboard: ${error.message}</div>
                `;
            }
        }

        // Load on page load
        window.addEventListener('load', loadDashboard);
    </script>
</body>
</html>
