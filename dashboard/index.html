<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Marketing AI Agent Dashboard</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        header {
            background: white;
            padding: 30px;
            border-radius: 10px;
            margin-bottom: 30px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        h1 {
            color: #333;
            margin-bottom: 10px;
        }

        .subtitle {
            color: #666;
            font-size: 14px;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            text-align: center;
        }

        .stat-number {
            font-size: 32px;
            font-weight: bold;
            color: #667eea;
            margin: 10px 0;
        }

        .stat-label {
            color: #666;
            font-size: 14px;
        }

        .agents-section {
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        .agent-card {
            border: 1px solid #eee;
            padding: 20px;
            margin-bottom: 20px;
            border-radius: 8px;
            background: #f9f9f9;
        }

        .agent-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .agent-name {
            font-size: 18px;
            font-weight: bold;
            color: #333;
        }

        .agent-brand {
            background: #667eea;
            color: white;
            padding: 5px 10px;
            border-radius: 5px;
            font-size: 12px;
        }

        .agent-info {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
            margin-bottom: 15px;
        }

        .info-item {
            font-size: 13px;
        }

        .info-label {
            color: #999;
            font-weight: bold;
        }

        .info-value {
            color: #333;
            margin-top: 3px;
        }

        .posts-list {
            background: white;
            padding: 15px;
            border-radius: 5px;
            margin-top: 15px;
        }

        .post-item {
            background: #f0f0f0;
            padding: 15px;
            margin-bottom: 10px;
            border-left: 4px solid #667eea;
            border-radius: 3px;
        }

        .post-platform {
            display: inline-block;
            background: #667eea;
            color: white;
            padding: 3px 8px;
            border-radius: 3px;
            font-size: 11px;
            margin-bottom: 8px;
        }

        .post-status {
            display: inline-block;
            background: #ffc107;
            color: black;
            padding: 3px 8px;
            border-radius: 3px;
            font-size: 11px;
            margin-left: 5px;
        }

        .post-content {
            color: #333;
            margin-top: 8px;
            font-style: italic;
        }

        .loading {
            text-align: center;
            padding: 40px;
            font-size: 18px;
            color: #999;
        }

        .error {
            background: #ff6b6b;
            color: white;
            padding: 20px;
            border-radius: 10px;
            margin: 20px 0;
        }

        .refresh-btn {
            background: #667eea;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 14px;
            margin-bottom: 20px;
        }

        .refresh-btn:hover {
            background: #764ba2;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🤖 Marketing AI Agent Dashboard</h1>
            <p class="subtitle">Autonomous AI agents for social media marketing</p>
        </header>

        <button class="refresh-btn" onclick="loadDashboard()">🔄 Refresh</button>

        <div class="stats" id="stats">
            <div class="loading">Loading...</div>
        </div>

        <div class="agents-section" id="agents">
            <div class="loading">Loading agents...</div>
        </div>
    </div>

    <script>
        function viewAgentDetails(agentId) {
            window.location.href = `/agent-detail.html?id=${agentId}`;
        }

        async function loadDashboard() {
            try {
                const response = await fetch('/api/agents');
                const data = await response.json();

                // Update stats
                const statsHtml = `
                    <div class="stat-card">
                        <div class="stat-label">Total Agents</div>
                        <div class="stat-number">${data.total_agents}</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-label">Total Posts</div>
                        <div class="stat-number">${data.total_posts}</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-label">Total Interactions</div>
                        <div class="stat-number">${data.total_interactions}</div>
                    </div>
                `;
                document.getElementById('stats').innerHTML = statsHtml;

                // Update agents
                let agentsHtml = '<h2 style="margin-bottom: 20px;">📊 Agents</h2>';

                if (data.agents && data.agents.length > 0) {
                    agentsHtml += data.agents.map(agent => `
                        <div class="agent-card" style="cursor: pointer; transition: all 0.3s;" onclick="viewAgentDetails(${agent.agent_id})">
                            <div class="agent-header">
                                <div class="agent-name" style="color: #667eea; text-decoration: underline;">${agent.agent_name}</div>
                                <span class="agent-brand">${agent.brand}</span>
                            </div>
                            <div class="agent-info">
                                <div class="info-item">
                                    <div class="info-label">Persona</div>
                                    <div class="info-value">${agent.persona}</div>
                                </div>
                                <div class="info-item">
                                    <div class="info-label">Tone</div>
                                    <div class="info-value">${agent.tone}</div>
                                </div>
                                <div class="info-item">
                                    <div class="info-label">Fields</div>
                                    <div class="info-value">${agent.fields.join(', ')}</div>
                                </div>
                                <div class="info-item">
                                    <div class="info-label">Posts</div>
                                    <div class="info-value">${agent.analytics.total_posts} published</div>
                                </div>
                                <div class="info-item">
                                    <div class="info-label">Drafts</div>
                                    <div class="info-value">${agent.draft_posts} draft</div>
                                </div>
                                <div class="info-item">
                                    <div class="info-label">Interactions</div>
                                    <div class="info-value">${agent.analytics.total_interactions}</div>
                                </div>
                            </div>
                            <div class="posts-list">
                                <strong>Posts: ${agent.draft_posts + agent.analytics.total_posts}</strong>
                                <p style="margin-top: 8px; color: #999; font-size: 12px;">
                                    • ${agent.draft_posts} draft post(s)<br>
                                    • ${agent.scheduled_posts} scheduled post(s)<br>
                                    • ${agent.analytics.total_posts} published post(s)
                                </p>
                            </div>
                        </div>
                    `).join('');
                } else {
                    agentsHtml += '<p>No agents created yet.</p>';
                }

                document.getElementById('agents').innerHTML = agentsHtml;
            } catch (error) {
                console.error('Error:', error);
                document.getElementById('agents').innerHTML = `
                    <div class="error">Error loading dashboard: ${error.message}</div>
                `;
            }
        }

        // Load on page load
        window.addEventListener('load', loadDashboard);
    </script>
</body>
</html>
