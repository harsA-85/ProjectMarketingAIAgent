<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agent Details - Marketing AI Dashboard</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        header {
            background: white;
            padding: 20px 30px;
            border-radius: 10px;
            margin-bottom: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header-buttons {
            display: flex;
            gap: 10px;
        }

        .btn {
            background: #667eea;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 14px;
            text-decoration: none;
            display: inline-block;
            transition: all 0.3s;
        }

        .btn:hover {
            background: #764ba2;
        }

        .btn-edit {
            background: #28a745;
        }

        .btn-edit:hover {
            background: #218838;
        }

        h1 {
            color: #333;
            flex: 1;
        }

        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            background: white;
            padding: 10px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        .tab-btn {
            background: #f0f0f0;
            border: none;
            padding: 12px 20px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s;
        }

        .tab-btn.active {
            background: #667eea;
            color: white;
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        .section {
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            margin-bottom: 20px;
        }

        .section h2 {
            color: #333;
            margin-bottom: 20px;
            border-bottom: 2px solid #667eea;
            padding-bottom: 10px;
        }

        .info-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 20px;
        }

        .info-box {
            background: #f9f9f9;
            padding: 15px;
            border-radius: 8px;
            border-left: 4px solid #667eea;
        }

        .info-label {
            font-weight: bold;
            color: #667eea;
            font-size: 12px;
            text-transform: uppercase;
            margin-bottom: 5px;
        }

        .info-value {
            color: #333;
            font-size: 16px;
        }

        /* Posts Grid */
        .posts-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
            gap: 24px;
            margin-top: 20px;
            align-items: start;
        }

        .preview-status {
            display: inline-block;
            padding: 3px 8px;
            border-radius: 20px;
            font-size: 10px;
            font-weight: bold;
            letter-spacing: 0.5px;
        }
        .status-draft { background: #ffc107; color: #000; }
        .status-published { background: #28a745; color: white; }
        .status-scheduled { background: #17a2b8; color: white; }

        /* ── CAROUSEL ── */
        .carousel { position: relative; background: #000; overflow: hidden; aspect-ratio: 1; }
        .carousel-slide { display: none; width: 100%; height: 100%; }
        .carousel-slide.active { display: block; }
        .carousel-slide img { width: 100%; height: 100%; object-fit: cover; }
        .carousel-btn {
            position: absolute; top: 50%; transform: translateY(-50%);
            background: rgba(255,255,255,0.85); border: none; border-radius: 50%;
            width: 28px; height: 28px; font-size: 18px; cursor: pointer; line-height: 1;
            display: flex; align-items: center; justify-content: center;
        }
        .carousel-btn.prev { left: 8px; }
        .carousel-btn.next { right: 8px; }
        .carousel-dots { position: absolute; bottom: 8px; left: 50%; transform: translateX(-50%); display: flex; gap: 4px; }
        .dot { width: 6px; height: 6px; border-radius: 50%; background: rgba(255,255,255,0.5); cursor: pointer; }
        .dot.active { background: white; }
        .carousel-count {
            position: absolute; top: 10px; right: 10px;
            background: rgba(0,0,0,0.5); color: white;
            font-size: 11px; padding: 2px 8px; border-radius: 10px;
        }

        /* ── INSTAGRAM ── */
        .ig-card { background: #fff; border: 1px solid #dbdbdb; border-radius: 8px; max-width: 400px; font-family: -apple-system, sans-serif; overflow: hidden; }
        .ig-header { display: flex; align-items: center; padding: 10px 12px; gap: 10px; }
        .ig-avatar { width: 36px; height: 36px; border-radius: 50%; background: linear-gradient(45deg, #f09433,#e6683c,#dc2743,#cc2366,#bc1888); display: flex; align-items: center; justify-content: center; color: white; font-weight: bold; font-size: 15px; flex-shrink: 0; }
        .ig-user-info { flex: 1; }
        .ig-username { font-size: 13px; font-weight: 600; color: #000; }
        .ig-location { font-size: 11px; color: #666; }
        .ig-menu { font-size: 18px; color: #000; cursor: pointer; }
        .ig-placeholder { background: #f0f0f0; aspect-ratio: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; font-size: 40px; gap: 8px; }
        .ig-actions { display: flex; align-items: center; padding: 8px 12px; gap: 14px; }
        .ig-action { font-size: 22px; cursor: pointer; }
        .ig-save { margin-left: auto; font-size: 22px; cursor: pointer; }
        .ig-body { padding: 0 12px 12px; }
        .ig-likes { font-size: 13px; font-weight: 600; color: #000; display: block; margin-bottom: 4px; }
        .ig-caption { font-size: 13px; color: #000; line-height: 1.5; }
        .ig-hashtags { font-size: 13px; color: #0095f6; margin-top: 4px; }
        .ig-time { font-size: 10px; color: #8e8e8e; margin-top: 6px; text-transform: uppercase; letter-spacing: 0.5px; }

        /* ── TWITTER/X ── */
        .tw-card { background: #fff; border: 1px solid #e1e8ed; border-radius: 12px; padding: 16px; font-family: -apple-system, sans-serif; overflow: hidden; }
        .tw-header { display: flex; align-items: flex-start; gap: 10px; margin-bottom: 10px; }
        .tw-avatar { width: 40px; height: 40px; border-radius: 50%; background: #1d9bf0; display: flex; align-items: center; justify-content: center; color: white; font-weight: bold; font-size: 16px; flex-shrink: 0; }
        .tw-user-info { flex: 1; }
        .tw-name { font-size: 14px; font-weight: 700; color: #0f1419; }
        .tw-verified { color: #1d9bf0; }
        .tw-handle { font-size: 13px; color: #536471; }
        .tw-x-logo { font-size: 18px; color: #000; font-weight: bold; }
        .tw-body { font-size: 15px; color: #0f1419; line-height: 1.5; margin-bottom: 10px; white-space: pre-wrap; }
        .tw-hashtags { color: #1d9bf0; font-size: 14px; margin-bottom: 10px; }
        .tw-images { display: grid; grid-template-columns: 1fr 1fr; gap: 2px; border-radius: 12px; overflow: hidden; margin-bottom: 10px; }
        .tw-images img { width: 100%; aspect-ratio: 1; object-fit: cover; }
        .tw-images img:only-child { grid-column: 1/-1; aspect-ratio: 16/9; }
        .tw-meta { font-size: 13px; color: #536471; padding: 10px 0; border-top: 1px solid #e1e8ed; border-bottom: 1px solid #e1e8ed; display: flex; align-items: center; }
        .tw-actions { display: flex; justify-content: space-between; padding-top: 8px; }
        .tw-action { font-size: 13px; color: #536471; cursor: pointer; }

        /* ── TIKTOK ── */
        .tt-card { position: relative; width: 100%; aspect-ratio: 9/16; max-height: 560px; border-radius: 12px; overflow: hidden; background: #000; font-family: -apple-system, sans-serif; }
        .tt-bg { width: 100%; height: 100%; background: linear-gradient(135deg, #1a1a2e, #16213e, #0f3460); }
        .tt-bg-img { width: 100%; height: 100%; }
        .tt-bg-img img { width: 100%; height: 100%; object-fit: cover; }
        .tt-overlay { position: absolute; inset: 0; display: flex; flex-direction: column; padding: 12px; }
        .tt-top { display: flex; justify-content: space-between; align-items: center; }
        .tt-following { color: white; font-size: 13px; font-weight: 600; border: 1px solid white; padding: 3px 10px; border-radius: 4px; }
        .tt-right-actions { position: absolute; right: 10px; bottom: 120px; display: flex; flex-direction: column; align-items: center; gap: 18px; }
        .tt-action-btn { color: white; text-align: center; font-size: 22px; cursor: pointer; line-height: 1.2; }
        .tt-action-btn span { font-size: 11px; display: block; }
        .tt-avatar { width: 40px; height: 40px; border-radius: 50%; background: linear-gradient(45deg,#fe2c55,#25f4ee); display: flex; align-items: center; justify-content: center; color: white; font-weight: bold; border: 2px solid white; }
        .tt-bottom { position: absolute; bottom: 0; left: 0; right: 60px; padding: 0 12px 20px; background: linear-gradient(transparent, rgba(0,0,0,0.7)); }
        .tt-username { color: white; font-weight: 700; font-size: 15px; margin-bottom: 6px; }
        .tt-caption { color: rgba(255,255,255,0.9); font-size: 13px; line-height: 1.4; margin-bottom: 6px; }
        .tt-hashtags { color: white; font-size: 13px; font-weight: 600; margin-bottom: 6px; }
        .tt-song { color: rgba(255,255,255,0.8); font-size: 12px; display: flex; align-items: center; gap: 4px; }

        .empty-state {
            text-align: center;
            padding: 40px;
            color: #999;
        }

        /* Modal Styles */
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.5);
        }

        .modal.show {
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .modal-content {
            background-color: white;
            padding: 30px;
            border-radius: 10px;
            width: 90%;
            max-width: 600px;
            max-height: 80vh;
            overflow-y: auto;
            box-shadow: 0 4px 20px rgba(0,0,0,0.3);
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 2px solid #667eea;
        }

        .close-btn {
            background: none;
            border: none;
            font-size: 28px;
            cursor: pointer;
            color: #999;
        }

        .close-btn:hover {
            color: #333;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            color: #333;
        }

        .form-group input,
        .form-group textarea,
        .form-group select {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 14px;
            font-family: inherit;
        }

        .form-group textarea {
            resize: vertical;
            min-height: 100px;
        }

        .form-buttons {
            display: flex;
            gap: 10px;
            justify-content: flex-end;
            margin-top: 30px;
            padding-top: 20px;
            border-top: 1px solid #eee;
        }

        .btn-submit {
            background: #667eea;
            color: white;
            border: none;
            padding: 10px 25px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
        }

        .btn-submit:hover {
            background: #764ba2;
        }

        .btn-cancel {
            background: #ccc;
            color: #333;
            border: none;
            padding: 10px 25px;
            border-radius: 5px;
            cursor: pointer;
        }

        .btn-cancel:hover {
            background: #bbb;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: #999;
        }

        .error {
            background: #ff6b6b;
            color: white;
            padding: 20px;
            border-radius: 10px;
            margin: 20px 0;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <a href="/" class="btn">← Back to Dashboard</a>
            <h1 id="agent-title">Loading...</h1>
            <div class="header-buttons">
                <button class="btn btn-edit" onclick="openEditModal()">✏️ Edit Agent</button>
                <button class="btn" onclick="deleteAgent()" style="background: #dc3545;">🗑️ Delete</button>
            </div>
        </header>

        <div class="tabs">
            <button class="tab-btn active" onclick="switchTab('overview')">📊 Overview</button>
            <button class="tab-btn" onclick="switchTab('posts')">📱 Social Media Posts</button>
            <button class="tab-btn" onclick="switchTab('accounts')">🔗 Connected Accounts</button>
        </div>

        <!-- Overview Tab -->
        <div id="overview" class="tab-content active">
            <div class="section" id="overview-content">
                <div class="loading">Loading agent data...</div>
            </div>
        </div>

        <!-- Posts Tab -->
        <div id="posts" class="tab-content">
            <div class="section">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
                    <h2 style="margin: 0;">📱 Social Media Posts</h2>
                    <button class="btn btn-edit" onclick="openGenerateModal()">✨ Generate New Post</button>
                </div>
                <div id="posts-content" class="loading">Loading posts...</div>
            </div>
        </div>

        <!-- Accounts Tab -->
        <div id="accounts" class="tab-content">
            <div class="section">
                <h2>🔗 Connected Social Media Accounts</h2>
                <div id="accounts-content" class="loading">Loading accounts...</div>
            </div>
        </div>
    </div>

    <!-- Edit Modal -->
    <div id="editModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Edit Agent</h2>
                <button class="close-btn" onclick="closeEditModal()">×</button>
            </div>
            <form id="editForm">
                <div class="form-group">
                    <label>Agent Name</label>
                    <input type="text" id="agentName" required>
                </div>
                <div class="form-group">
                    <label>Brand</label>
                    <input type="text" id="brand" required>
                </div>
                <div class="form-group">
                    <label>Persona</label>
                    <input type="text" id="persona" required>
                </div>
                <div class="form-group">
                    <label>Tone of Voice</label>
                    <input type="text" id="tone" required>
                </div>
                <div class="form-group">
                    <label>Fields (comma-separated)</label>
                    <input type="text" id="fields" required>
                </div>
                <div class="form-group">
                    <label>Bio</label>
                    <textarea id="bio"></textarea>
                </div>
                <div class="form-group">
                    <label>Image Style (for AI-generated visuals)</label>
                    <select id="imageStyle">
                        <option value="ultra realistic photography">📷 Ultra Realistic Photography</option>
                        <option value="cinematic film photography, dramatic lighting">🎬 Cinematic / Film</option>
                        <option value="minimalist clean graphic design, flat colors">🎨 Minimalist / Flat Design</option>
                        <option value="bold vibrant graphic design, pop art style">🎭 Bold / Pop Art</option>
                        <option value="luxury high-end editorial photography">💎 Luxury / Editorial</option>
                        <option value="cartoon illustration, colorful and fun">🖍️ Cartoon / Illustration</option>
                        <option value="3D render, modern and sleek">🧊 3D Render</option>
                        <option value="dark moody aesthetic, high contrast">🌑 Dark / Moody</option>
                        <option value="warm vintage film photography, retro tones">🎞️ Vintage / Retro</option>
                        <option value="futuristic neon cyberpunk aesthetic">🌆 Futuristic / Neon</option>
                    </select>
                </div>
                <div class="form-buttons">
                    <button type="button" class="btn-cancel" onclick="closeEditModal()">Cancel</button>
                    <button type="submit" class="btn-submit">Save Changes</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Generate Content Modal -->
    <div id="generateModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Generate New Post</h2>
                <button class="close-btn" onclick="closeGenerateModal()">×</button>
            </div>
            <form id="generateForm">
                <div class="form-group">
                    <label>Platform</label>
                    <select id="platform" required>
                        <option value="instagram">📷 Instagram</option>
                        <option value="twitter">𝕏 Twitter/X</option>
                        <option value="tiktok">🎵 TikTok</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Topic (Optional - leave blank for random field)</label>
                    <input type="text" id="topic" placeholder="e.g., AI, Marketing, Technology">
                </div>
                <div class="form-buttons">
                    <button type="button" class="btn-cancel" onclick="closeGenerateModal()">Cancel</button>
                    <button type="submit" class="btn-submit">Generate Post</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        const agentId = new URLSearchParams(window.location.search).get('id') || 1;
        let agentData = null;

        function switchTab(tabName) {
            document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));

            document.getElementById(tabName).classList.add('active');
            event.target.classList.add('active');

            if (tabName === 'posts') loadPosts();
            if (tabName === 'accounts') loadAccounts();
        }

        function openEditModal() {
            if (!agentData) return;

            document.getElementById('agentName').value = agentData.agent_name;
            document.getElementById('brand').value = agentData.brand;
            document.getElementById('persona').value = agentData.persona;
            document.getElementById('tone').value = agentData.tone;
            document.getElementById('fields').value = agentData.fields.join(', ');
            document.getElementById('bio').value = agentData.bio || '';
            const styleSelect = document.getElementById('imageStyle');
            if (agentData.image_style) {
                styleSelect.value = agentData.image_style;
            }

            document.getElementById('editModal').classList.add('show');
        }

        function closeEditModal() {
            document.getElementById('editModal').classList.remove('show');
        }

        async function deleteAgent() {
            if (!confirm('Are you sure you want to delete this agent? This action cannot be undone.')) {
                return;
            }

            try {
                const response = await fetch(`/api/agents/${agentId}`, {
                    method: 'DELETE'
                });

                const result = await response.json();

                if (response.ok) {
                    alert('Agent deleted successfully!');
                    window.location.href = '/';
                } else {
                    alert('Error: ' + (result.error || 'Failed to delete agent'));
                }
            } catch (error) {
                alert('Error deleting agent: ' + error.message);
            }
        }

        function openGenerateModal() {
            document.getElementById('generateModal').classList.add('show');
        }

        function closeGenerateModal() {
            document.getElementById('generateModal').classList.remove('show');
        }

        document.getElementById('generateForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const platform = document.getElementById('platform').value;
            const topic = document.getElementById('topic').value || agentData.fields[0] || 'general';

            try {
                const response = await fetch(`/api/content/generate`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        agent_id: agentId,
                        platform: platform,
                        topic: topic
                    })
                });

                const result = await response.json();

                if (response.ok) {
                    alert(`Post generated successfully!`);
                    closeGenerateModal();
                    // Reload posts
                    document.getElementById('posts-content').innerHTML = '<div class="loading">Loading posts...</div>';
                    loadPosts();
                } else {
                    alert('Error: ' + (result.error || 'Failed to generate post'));
                }
            } catch (error) {
                alert('Error generating post: ' + error.message);
            }
        });

        document.getElementById('editForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const formData = {
                name: document.getElementById('agentName').value,
                brand: document.getElementById('brand').value,
                persona: document.getElementById('persona').value,
                tone_of_voice: document.getElementById('tone').value,
                fields: document.getElementById('fields').value,
                bio: document.getElementById('bio').value,
                image_style: document.getElementById('imageStyle').value
            };

            try {
                const response = await fetch(`/api/agents/${agentId}`, {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(formData)
                });

                const result = await response.json();

                if (response.ok) {
                    alert('Agent updated successfully!');
                    closeEditModal();
                    // Reload agent data
                    agentData = null;
                    loadAgentData();
                } else {
                    alert('Error: ' + (result.error || 'Failed to update agent'));
                }
            } catch (error) {
                alert('Error updating agent: ' + error.message);
            }
        });

        async function loadAgentData() {
            try {
                const response = await fetch(`/api/agents/${agentId}`);
                agentData = await response.json();

                document.getElementById('agent-title').textContent = `${agentData.agent_name} - ${agentData.brand}`;

                const html = `
                    <h2>👤 Agent Profile</h2>
                    <div class="info-grid">
                        <div class="info-box">
                            <div class="info-label">Agent Name</div>
                            <div class="info-value">${agentData.agent_name}</div>
                        </div>
                        <div class="info-box">
                            <div class="info-label">Brand</div>
                            <div class="info-value">${agentData.brand}</div>
                        </div>
                        <div class="info-box">
                            <div class="info-label">Persona</div>
                            <div class="info-value">${agentData.persona}</div>
                        </div>
                        <div class="info-box">
                            <div class="info-label">Tone of Voice</div>
                            <div class="info-value">${agentData.tone}</div>
                        </div>
                        <div class="info-box">
                            <div class="info-label">Fields</div>
                            <div class="info-value">${agentData.fields.join(', ')}</div>
                        </div>
                        <div class="info-box">
                            <div class="info-label">Status</div>
                            <div class="info-value" style="color: #28a745;">✓ Active</div>
                        </div>
                    </div>

                    <h2 style="margin-top: 30px;">📊 Quick Stats</h2>
                    <div class="info-grid">
                        <div class="info-box">
                            <div class="info-label">Total Posts</div>
                            <div class="info-value">${agentData.analytics.total_posts}</div>
                        </div>
                        <div class="info-box">
                            <div class="info-label">Draft Posts</div>
                            <div class="info-value">${agentData.draft_posts}</div>
                        </div>
                        <div class="info-box">
                            <div class="info-label">Scheduled Posts</div>
                            <div class="info-value">${agentData.scheduled_posts}</div>
                        </div>
                        <div class="info-box">
                            <div class="info-label">Total Interactions</div>
                            <div class="info-value">${agentData.analytics.total_interactions}</div>
                        </div>
                    </div>
                `;

                document.getElementById('overview-content').innerHTML = html;
            } catch (error) {
                document.getElementById('overview-content').innerHTML = `<div class="error">Error loading agent data: ${error.message}</div>`;
            }
        }

        async function loadPosts() {
            try {
                const response = await fetch(`/api/agents/${agentId}/posts`);
                const data = await response.json();

                if (!data.posts || data.posts.length === 0) {
                    document.getElementById('posts-content').innerHTML = `
                        <div class="empty-state">
                            <div style="font-size: 48px; margin-bottom: 10px;">📝</div>
                            <p>No posts yet. Create some content to get started!</p>
                        </div>
                    `;
                    return;
                }

                const html = `
                    <div class="posts-grid">
                        ${data.posts.map(post => createSocialPreview(post)).join('')}
                    </div>
                `;

                document.getElementById('posts-content').innerHTML = html;
            } catch (error) {
                document.getElementById('posts-content').innerHTML = `<div class="error">Error loading posts: ${error.message}</div>`;
            }
        }

        function createSocialPreview(post) {
            if (post.platform === 'instagram') return createInstagramPreview(post);
            if (post.platform === 'twitter') return createTwitterPreview(post);
            if (post.platform === 'tiktok') return createTikTokPreview(post);
            return '';
        }

        function getCarouselHtml(images) {
            if (!images || images.length === 0) return '';
            const id = 'carousel_' + Math.random().toString(36).substr(2, 9);
            return `
                <div class="carousel" id="${id}">
                    <div class="carousel-track">
                        ${images.map((img, i) => `
                            <div class="carousel-slide ${i === 0 ? 'active' : ''}">
                                <img src="data:image/png;base64,${img}" alt="Post image ${i+1}">
                            </div>
                        `).join('')}
                    </div>
                    ${images.length > 1 ? `
                        <div class="carousel-dots">
                            ${images.map((_, i) => `<span class="dot ${i === 0 ? 'active' : ''}" onclick="goToSlide('${id}', ${i})"></span>`).join('')}
                        </div>
                        <button class="carousel-btn prev" onclick="changeSlide('${id}', -1)">&#8249;</button>
                        <button class="carousel-btn next" onclick="changeSlide('${id}', 1)">&#8250;</button>
                        <div class="carousel-count">${images.length} images</div>
                    ` : ''}
                </div>`;
        }

        function createInstagramPreview(post) {
            const username = (agentData.agent_name || 'agent').toLowerCase().replace(/\s+/g, '_');
            const avatar = agentData.agent_name ? agentData.agent_name[0].toUpperCase() : 'A';
            const images = post.media_urls || [];
            const statusClass = `status-${post.status}`;

            return `
            <div class="ig-card">
                <div class="ig-header">
                    <div class="ig-avatar">${avatar}</div>
                    <div class="ig-user-info">
                        <div class="ig-username">${username}</div>
                        <div class="ig-location">${agentData.brand}</div>
                    </div>
                    <div class="ig-menu">
                        <span class="preview-status ${statusClass}">${post.status.toUpperCase()}</span>
                    </div>
                </div>
                ${images.length > 0 ? getCarouselHtml(images) : `
                    <div class="ig-placeholder">
                        <span>📷</span>
                        <span style="font-size:12px;color:#999">Generating images...</span>
                    </div>
                `}
                <div class="ig-actions">
                    <span class="ig-action">♡</span>
                    <span class="ig-action">💬</span>
                    <span class="ig-action">↗</span>
                    <span class="ig-save">🔖</span>
                </div>
                <div class="ig-body">
                    <span class="ig-likes">❤️ —</span>
                    <div class="ig-caption"><strong>${username}</strong> ${post.body}</div>
                    ${post.hashtags && post.hashtags.length > 0 ? `
                        <div class="ig-hashtags">${post.hashtags.slice(0,5).map(h => `#${h}`).join(' ')}</div>
                    ` : ''}
                    <div class="ig-time">${new Date(post.created_at).toLocaleDateString('en-US', {month:'long', day:'numeric'}).toUpperCase()}</div>
                </div>
            </div>`;
        }

        function createTwitterPreview(post) {
            const username = (agentData.agent_name || 'agent').toLowerCase().replace(/\s+/g, '');
            const avatar = agentData.agent_name ? agentData.agent_name[0].toUpperCase() : 'A';
            const images = post.media_urls || [];
            const statusClass = `status-${post.status}`;

            return `
            <div class="tw-card">
                <div class="tw-header">
                    <div class="tw-avatar">${avatar}</div>
                    <div class="tw-user-info">
                        <div class="tw-name">${agentData.agent_name} <span class="tw-verified">✓</span></div>
                        <div class="tw-handle">@${username}</div>
                    </div>
                    <div class="tw-x-logo">𝕏</div>
                </div>
                <div class="tw-body">${post.body}</div>
                ${post.hashtags && post.hashtags.length > 0 ? `
                    <div class="tw-hashtags">${post.hashtags.slice(0,3).map(h => `#${h}`).join(' ')}</div>
                ` : ''}
                ${images.length > 0 ? `
                    <div class="tw-images">
                        ${images.slice(0,4).map(img => `<img src="data:image/png;base64,${img}" alt="post">`).join('')}
                    </div>
                ` : ''}
                <div class="tw-meta">
                    <span>${new Date(post.created_at).toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'})} · ${new Date(post.created_at).toLocaleDateString('en-US', {month:'short', day:'numeric', year:'numeric'})}</span>
                    <span class="preview-status ${statusClass}" style="margin-left:auto">${post.status.toUpperCase()}</span>
                </div>
                <div class="tw-actions">
                    <span class="tw-action">💬 —</span>
                    <span class="tw-action">🔁 —</span>
                    <span class="tw-action">♡ —</span>
                    <span class="tw-action">📊 —</span>
                </div>
            </div>`;
        }

        function createTikTokPreview(post) {
            const username = (agentData.agent_name || 'agent').toLowerCase().replace(/\s+/g, '');
            const avatar = agentData.agent_name ? agentData.agent_name[0].toUpperCase() : 'A';
            const images = post.media_urls || [];
            const statusClass = `status-${post.status}`;

            return `
            <div class="tt-card">
                ${images.length > 0 ? `
                    <div class="tt-bg-img">
                        <img src="data:image/png;base64,${images[0]}" alt="cover">
                    </div>
                ` : `<div class="tt-bg"></div>`}
                <div class="tt-overlay">
                    <div class="tt-top">
                        <span class="preview-status ${statusClass}">${post.status.toUpperCase()}</span>
                        <span class="tt-following">Following</span>
                    </div>
                    <div class="tt-right-actions">
                        <div class="tt-action-btn"><div class="tt-avatar">${avatar}</div></div>
                        <div class="tt-action-btn">♡<br><span>—</span></div>
                        <div class="tt-action-btn">💬<br><span>—</span></div>
                        <div class="tt-action-btn">↗<br><span>—</span></div>
                        <div class="tt-action-btn">🎵</div>
                    </div>
                    <div class="tt-bottom">
                        <div class="tt-username">@${username}</div>
                        <div class="tt-caption">${post.body.substring(0, 120)}${post.body.length > 120 ? '...' : ''}</div>
                        ${post.hashtags && post.hashtags.length > 0 ? `
                            <div class="tt-hashtags">${post.hashtags.slice(0,3).map(h => `#${h}`).join(' ')}</div>
                        ` : ''}
                        <div class="tt-song">♪ Original sound - ${agentData.brand}</div>
                    </div>
                </div>
            </div>`;
        }

        function changeSlide(carouselId, dir) {
            const carousel = document.getElementById(carouselId);
            const slides = carousel.querySelectorAll('.carousel-slide');
            const dots = carousel.querySelectorAll('.dot');
            let current = [...slides].findIndex(s => s.classList.contains('active'));
            slides[current].classList.remove('active');
            dots[current].classList.remove('active');
            current = (current + dir + slides.length) % slides.length;
            slides[current].classList.add('active');
            dots[current].classList.add('active');
        }

        function goToSlide(carouselId, index) {
            const carousel = document.getElementById(carouselId);
            const slides = carousel.querySelectorAll('.carousel-slide');
            const dots = carousel.querySelectorAll('.dot');
            slides.forEach(s => s.classList.remove('active'));
            dots.forEach(d => d.classList.remove('active'));
            slides[index].classList.add('active');
            dots[index].classList.add('active');
        }

        async function loadAccounts() {
            try {
                const response = await fetch(`/api/agents/${agentId}/accounts`);
                const data = await response.json();

                if (!data.accounts || data.accounts.length === 0) {
                    document.getElementById('accounts-content').innerHTML = `
                        <div class="empty-state">
                            <div style="font-size: 48px; margin-bottom: 10px;">🔗</div>
                            <p>No connected accounts yet.</p>
                        </div>
                    `;
                    return;
                }

                const html = `
                    <div class="info-grid">
                        ${data.accounts.map(account => `
                            <div class="info-box" style="border-left-color: ${account.is_connected ? '#28a745' : '#dc3545'};">
                                <div style="font-size: 18px; margin-bottom: 10px;">
                                    ${account.platform === 'twitter' ? '𝕏' : (account.platform === 'instagram' ? '📷' : '🎵')}
                                    ${account.platform.charAt(0).toUpperCase() + account.platform.slice(1)}
                                </div>
                                <div class="info-label">Username</div>
                                <div class="info-value">@${account.username}</div>
                                <div class="info-label" style="margin-top: 10px;">Status</div>
                                <div class="info-value" style="color: ${account.is_connected ? '#28a745' : '#dc3545'};">
                                    ${account.is_connected ? '🟢 Connected' : '🔴 Disconnected'}
                                </div>
                                <div class="info-label" style="margin-top: 10px;">Followers</div>
                                <div class="info-value">${account.followers.toLocaleString()}</div>
                            </div>
                        `).join('')}
                    </div>
                `;

                document.getElementById('accounts-content').innerHTML = html;
            } catch (error) {
                document.getElementById('accounts-content').innerHTML = `<div class="error">Error loading accounts: ${error.message}</div>`;
            }
        }

        window.addEventListener('load', loadAgentData);
    </script>
</body>
</html>
